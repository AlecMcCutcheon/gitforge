[package]
name = "freenet-hub-tip"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"
publish = false
description = "Tip-only Freenet pack fetch for FreenetHub browse (skips legacy bundles)"

[[bin]]
name = "freenet-hub-tip"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1.5"
bs58 = "0.5"
clap = { version = "4.5", features = ["derive", "env"] }
freenet-git = { path = "../../freenet-git/crates/freenet-git" }
freenet-git-tip = { path = "../../freenet-git/crates/tip" }
freenet-git-types = { path = "../../freenet-git/crates/types", features = ["signing"] }
freenet-stdlib = { version = "0.6.0", features = ["net"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.42", features = ["full"] }
