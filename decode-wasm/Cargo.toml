[package]
name = "freenet-hub-decode"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-only"
publish = false
description = "Wasm helpers: decode freenet-git RepoState tip metadata for FreenetHub browser mode"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
freenet-git-types = { path = "../../freenet-git/crates/types" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
